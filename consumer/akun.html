<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Akun Konsumen — Q-Pack" />
    <title>Akun Pengguna — Q-Pack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="q-header">
        <div class="q-header__left">
          <a href="/consumer/dashboard.html">
            <img src="/assets/logo/Qpack Logo FINAL.png" alt="Q-Pack" class="q-header__logo" />
          </a>
        </div>
      </header>

      <main class="app-content">
        <div class="profile-card">
          <img src="/assets/icons/cust-role-icon.svg" alt="Avatar" class="profile-card__avatar" style="padding: 14px; background: #eaf6e5;" />
          <div class="profile-card__body">
            <div class="profile-card__name" id="profile-name">Budi Santoso</div>
            <div class="profile-card__meta" id="profile-email">budi.santoso@qpack.id</div>
            <span class="status-badge status-badge--success" style="margin-top: 6px;">Akun Konsumen Aktif</span>
          </div>
        </div>

        <div style="margin-top: 20px;">
          <h3 class="section-title">Informasi Akun</h3>
          <div class="menu-list">
            <div class="menu-item">
              <img src="/assets/icons/reward-icon.svg" class="menu-item__icon" alt="" />
              <div class="menu-item__body">
                <div class="menu-item__title">Total Poin Q-Pack</div>
                <div class="menu-item__desc" id="profile-points">0 Points</div>
              </div>
            </div>
            <div class="menu-item">
              <img src="/assets/icons/traceability-icon.svg" class="menu-item__icon" alt="" />
              <div class="menu-item__body">
                <div class="menu-item__title">Koleksi Q-Pack Terverifikasi</div>
                <div class="menu-item__desc" id="profile-collection">0 / 10 Kemasan</div>
              </div>
            </div>
            <a href="/merchant/dashboard.html" class="menu-item">
              <img src="/assets/icons/merchant-role-icon.svg" class="menu-item__icon" alt="" />
              <div class="menu-item__body">
                <div class="menu-item__title">Beralih ke Portal Merchant</div>
                <div class="menu-item__desc">Buka analitik dan dashboard mitra</div>
              </div>
              <span class="menu-item__arrow">&gt;</span>
            </a>
          </div>
        </div>

        <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px;">
          <a href="/index.html" class="btn btn--outline btn--full">
            Kembali ke Halaman Awal
          </a>
          <button id="btn-logout" class="btn btn--danger btn--full" style="font-size: 13px;">
            Keluar Akun (Logout)
          </button>
        </div>
      </main>

      <nav class="bottom-nav bottom-nav--consumer" aria-label="Navigasi Bawah">
        <a href="/consumer/dashboard.html" class="bottom-nav__item">
          <img src="/assets/icons/bottom-navbar-home-icon.svg" class="bottom-nav__icon" alt="" />
          <span class="bottom-nav__label">Home</span>
        </a>
        <a href="/consumer/scan.html" class="bottom-nav__item">
          <img src="/assets/icons/scan-icon.svg" class="bottom-nav__icon" alt="" />
          <span class="bottom-nav__label">Scan</span>
        </a>
        <a href="/consumer/reward.html" class="bottom-nav__item">
          <img src="/assets/icons/reward-icon.svg" class="bottom-nav__icon" alt="" />
          <span class="bottom-nav__label">Reward</span>
        </a>
        <a href="/consumer/akun.html" class="bottom-nav__item is-active">
          <img src="/assets/icons/usr-form-login-role-icon.svg" class="bottom-nav__icon" alt="" />
          <span class="bottom-nav__label">Akun</span>
        </a>
      </nav>
    </div>

    <script type="module">
      import { getConsumerProfile, getActiveConsumer, getActiveUser, logout } from '/js/app.js';
      async function init() {
        const authUser = getActiveUser();
        const active = getActiveConsumer();
        const targetId = (authUser && authUser.role === 'consumer') ? authUser.id : active.id;
        const data = await getConsumerProfile(targetId);
        document.getElementById('profile-name').textContent = data.consumer.name;
        document.getElementById('profile-email').textContent = data.consumer.email;
        document.getElementById('profile-points').textContent = `${data.consumer.points} Q-Pack Coin`;
        document.getElementById('profile-collection').textContent = `${data.consumer.unique_packages_collected ?? data.consumer.unique_packages_scanned} / ${data.consumer.collection_target} Kemasan`;

        document.getElementById('btn-logout').addEventListener('click', () => {
          logout();
        });
      }
      window.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
