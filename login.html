<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="QPack — Kemasan biodegradable dengan ekosistem digital sustainability.">
<title>Login — QPack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/qpack.css"></head>
<body>
<main class="auth-wrap">
    <section class="auth-card">
        <img class="auth-logo" src="assets/logo/Qpack Logo FINAL.png" alt="QPack">
        <h1>Selamat datang!</h1>
        <p>Masuk untuk melanjutkan ke akun Anda</p>
        <form data-demo-form="merchant/dashboard.html">
            <div class="form-group">
                <label>Email atau No. HP</label>
                <input class="input" type="text" placeholder="Email atau No. HP" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input class="input" type="password" placeholder="Password" required>
            </div>
            <div style="text-align:right;margin-bottom:18px">
                <a class="text-link" href="#">Lupa password?</a>
            </div>
            <strong>Masuk sebagai</strong>
            <div class="role-grid">
                <div class="role-option selected" data-role="merchant">
                    <img src="assets/icons/merchant-role-icon.svg" alt="">
                    <div><strong>Merchant</strong><small>Pantau konsumen dari QR dan kelola pesanan kemasan.</small></div>
                    <span class="check"></span>
                </div>
                <div class="role-option" data-role="consumer">
                    <img src="assets/icons/cust-role-icon.svg" alt="">
                    <div><strong>Konsumen</strong><small>Scan QR, kumpulkan poin, kenali bahan & dampak.</small></div>
                    <span class="check"></span>
                </div>
            </div>
            <input type="hidden" id="selected-role" value="merchant">
            <button class="btn btn-primary btn-block" type="submit">Masuk</button>
        </form>
        <div class="auth-foot">Belum punya akun? <a class="text-link" href="register-merchant.html">Daftar sekarang</a></div>
    </section>
</main>
<script src="js/app.js" defer></script>
</body>
</html>
