<body>
<div class="app-frame">
<header class="topbar"><div class="topbar-inner">
        <button class="icon-btn mobile-menu-btn" type="button"><img src="../assets/icons/sidemenu-icon.svg" alt=""></button>
        <a class="brand" href="dashboard.html"><img src="../assets/logo/Qpack Logo FINAL.png" alt="QPack"></a>
        <div class="topbar-actions"><button class="icon-btn" type="button"><img src="../assets/icons/bell-icon.svg" alt="Notifikasi"></button></div>

<main class="main"><div class="container">

<div class="page-heading"><h1>Checkout</h1><p>Periksa pesanan sebelum melakukan pembayaran.</p></div>
<div class="grid grid-2">
    <div class="card card-pad">

    <div class="card card-pad">
        <h2 style="font-size:18px">Pembayaran / DP</h2>
        <div class="form-group"><label>Metode Pembayaran</label><select class="input"><option>Transfer Bank</option><option>Virtual Account</option></select></div>
        <div class="form-group"><label>Jumlah DP</label><input class="input" value="Rp1.250.000"></div>
        <a class="btn btn-primary btn-block" href="status-order.html">Bayar & Buat Pesanan</a>
    </div>
</div>
