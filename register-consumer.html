<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="QPack — Kemasan biodegradable dengan ekosistem digital sustainability.">
<title>Konsumen — QPack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/qpack.css"></head>
<body>
<main class="auth-wrap">
<section class="auth-card">
    <a href="login.html" class="text-link">← Kembali</a>
    <img class="auth-logo" src="assets/icons/cust-role-icon.svg" alt="">
    <h1>Daftar sebagai Konsumen</h1>
    <p>Lengkapi data untuk membuat akun</p>
    <form data-demo-form="consumer/dashboard.html">
        
        <div class="form-group"><label>Nama Lengkap</label><input class="input" placeholder="Nama Lengkap" required></div>
        <div class="form-group"><label>Email</label><input class="input" type="email" placeholder="Email" required></div>
        <div class="form-group"><label>No. HP</label><input class="input" placeholder="No. HP" required></div>
        <div class="form-group"><label>Password</label><input class="input" type="password" placeholder="Password" required></div>
        <div class="form-group"><label>Konfirmasi Password</label><input class="input" type="password" placeholder="Konfirmasi Password" required></div>
    
        <button class="btn btn-primary btn-block" type="submit">Daftar Konsumen</button>
    </form>
    <div class="auth-foot">Sudah punya akun? <a class="text-link" href="login.html">Masuk di sini</a></div>
</section>
</main>
<script src="js/app.js" defer></script>
</body>
</html>
