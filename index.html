<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="QPack — kemasan biodegradable berbasis bahan alami untuk masa depan yang lebih baik."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <title>QPack — Kemasan Cerdas, Bumi Terjaga.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- QPack Design System -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Page-specific styling: does not modify the foundation files. -->
    <link rel="stylesheet" href="css/welcome.css" />
  </head>

  <body>
    <main class="welcome-page">
      <div class="welcome-page__content">
        <a
          class="welcome-page__logo-link"
          href="index.html"
          aria-label="QPack Beranda"
        >
          <img
            class="welcome-page__logo"
            src="assets/logo/Qpack Logo FINAL.png"
            alt="QPack"
          />
        </a>

        <section class="welcome-page__intro" aria-labelledby="welcome-title">
          <h1 id="welcome-title" class="welcome-page__title">
            Kemasan Cerdas,<br />
            Bumi Terjaga.
          </h1>

          <p class="welcome-page__description">
            Kemasan ramah lingkungan berbasis bahan alami untuk masa depan yang
            lebih baik.
          </p>
        </section>

        <div class="welcome-page__product" aria-hidden="true">
          <img
            src="assets/images/Prototype Polymailer.png"
            alt=""
            class="welcome-page__product-image"
          />
        </div>

        <div class="welcome-page__bottom">
          <div class="welcome-page__dots" aria-label="Slide 1 dari 3">
            <span class="welcome-page__dot welcome-page__dot--active"></span>
            <span class="welcome-page__dot"></span>
            <span class="welcome-page__dot"></span>
          </div>

          <a class="welcome-page__primary-action" href="login.html">
            Mulai
          </a>

          <a class="welcome-page__secondary-action" href="login.html">
            Pelajari lebih lanjut <span aria-hidden="true">&gt;</span>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
